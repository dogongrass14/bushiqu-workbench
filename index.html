<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1c1d21">
  <title>不识趣思考 · 决策工作台</title>
  <link rel="stylesheet" href="./static/app.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.github.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; base-uri 'self'; form-action 'none'">
</head>
<body>
  <header class="topbar">
    <div class="topbar-row">
      <h1>不识趣思考 · 决策工作台</h1>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="刷新">刷新</button>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="analytics" aria-selected="true">数据分析</button>
      <button class="tab" role="tab" data-tab="topics" aria-selected="false">选题与排期<span class="badge" id="badge-topics"></span></button>
      <button class="tab" role="tab" data-tab="stories" aria-selected="false">故事<span class="badge" id="badge-stories"></span></button>
      <button class="tab" role="tab" data-tab="pipelines" aria-selected="false">制作进度<span class="badge" id="badge-pipelines"></span></button>
    </nav>
  </header>

  <div id="banner" class="banner" hidden></div>
  <div id="demoNotice" class="demo-notice" hidden>当前包含【测试示例】条目，仅供试用界面，不是真实选题、故事或批准记录。</div>

  <main id="main">
    <section id="listView" aria-live="polite"></section>
    <section id="detailView" hidden></section>
  </main>

  <footer class="foot" id="foot">
    <span id="syncInfo">正在读取…</span>
  </footer>

  <div id="sheet" class="sheet" hidden>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle"></h2>
      <p id="sheetDesc" class="muted"></p>
      <textarea id="sheetComment" rows="6" placeholder="请写具体修改意见，例如：第二幕节奏太慢，删去……；或：人物年龄偏大……" hidden></textarea>
      <div class="sheet-actions">
        <button id="sheetCancel" type="button" class="btn ghost">取消</button>
        <button id="sheetConfirm" type="button" class="btn primary">确认提交</button>
      </div>
    </div>
  </div>

  <script src="./static/pipeline_ui.js"></script>
  <script src="./static/app.js"></script>
</body>
</html>
